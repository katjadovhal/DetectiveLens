services:
  postgres:
    image: postgres:16-alpine
    container_name: detectivelens-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: detectivelens
      POSTGRES_PASSWORD: detectivelens
      POSTGRES_DB: detectivelens
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
